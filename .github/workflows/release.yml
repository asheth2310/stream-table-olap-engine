name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short

      - name: Build Docker image
        run: |
          docker build -t stream-table-olap-engine:${{ github.ref_name }} .
          docker tag stream-table-olap-engine:${{ github.ref_name }} stream-table-olap-engine:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Stream-Table OLAP Engine ${{ github.ref_name }}

            ### What's included
            - ⚡ Python backend with FastAPI, DuckDB, polars
            - 🎨 Next.js dashboard with real-time metrics
            - 🐳 Docker image for deployment

            ### Quick Start
            ```bash
            docker compose up -d
            pip install -e .
            python -m olap_engine
            ```

            ### Dashboard
            ```bash
            cd dashboard && npm install && npm run dev
            ```
