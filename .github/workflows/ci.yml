name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Backend Tests (Python)
  # ─────────────────────────────────────────────
  backend-test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check olap_engine/ tests/

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --co -q | tail -5
          pytest tests/ -v --tb=short

      - name: Check import ordering
        run: ruff check --select I olap_engine/ tests/

  # ─────────────────────────────────────────────
  # Frontend Build (Next.js)
  # ─────────────────────────────────────────────
  frontend-build:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Type check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Build
        working-directory: dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.com

  # ─────────────────────────────────────────────
  # Docker Build
  # ─────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stream-table-olap-engine:test .

      - name: Verify container starts
        run: |
          docker run -d --name olap-test \
            -e KAFKA_BOOTSTRAP_SERVERS=disabled \
            -p 8000:8000 \
            stream-table-olap-engine:test
          sleep 5
          curl -f http://localhost:8000/health || true
          docker logs olap-test
          docker stop olap-test
